<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado de Vacunación - MINSA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: white;
    width: 100%;
    max-width: 420px;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 10px 14px;
    gap: 10px;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .escudo {
    width: 48px;
    height: 48px;
  }
  .minsa-label {
    display: flex;
    flex-direction: column;
  }
  .peru-text {
    background: #d40000;
    color: white;
    font-weight: 900;
    font-size: 13px;
    padding: 2px 6px;
    letter-spacing: 1px;
  }
  .ministerio-text {
    background: #5a5a5a;
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    line-height: 1.3;
  }

  /* CAMPANA */
  .campaign {
    text-align: center;
    padding: 20px 16px 12px;
  }
  .campaign-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
  }
  .lo1 { color: #1a73c8; }
  .lo2 { color: #e91e8c; }
  .needle {
    color: #1a73c8;
    font-size: 20px;
    margin-right: 2px;
  }

  /* QR */
  .qr-section {
    display: flex;
    justify-content: center;
    padding: 16px 0 20px;
  }
  .qr-section canvas {
    border: 2px solid #222;
  }

  /* NOMBRE */
  .nombre {
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    color: #111;
    padding: 4px 16px 16px;
    line-height: 1.3;
    letter-spacing: 0.3px;
  }

  /* DNI / EDAD */
  .datos {
    display: flex;
    justify-content: space-around;
    padding: 0 20px 12px;
    font-size: 14px;
    color: #333;
    border-bottom: 2px solid #1a73c8;
    margin: 0 16px;
  }
  .datos span b { color: #111; }

  /* VACUNACION */
  .vacuna-label {
    text-align: center;
    color: #1a73c8;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 0 12px;
    letter-spacing: 0.5px;
  }

  /* DOSIS BANNER */
  .dosis-banner {
    background: #1a73c8;
    color: white;
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    padding: 18px;
    letter-spacing: 1px;
  }

  /* VERIFICAR */
  .verificar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
    background: #f9f9f9;
    border-top: 1px solid #eee;
    margin-top: 2px;
  }
  .verificar p {
    font-size: 13px;
    font-weight: 600;
    color: #222;
    line-height: 1.5;
    max-width: 140px;
  }
  .lector-btn {
    background: #1a73c8;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .lector-btn svg {
    width: 38px;
    height: 38px;
    fill: white;
  }

  /* REGRESAR */
  .regresar {
    text-align: center;
    padding: 16px;
  }
  .regresar a {
    color: #1a73c8;
    font-size: 14px;
    text-decoration: underline;
  }
</style>
</head>

<script>
// QR Code generator - pure JS implementation
const QR_DATA = "HERNAN PAUL QUISPE PADILLA | DNI: 18857335 | 55 AÑOS | COVID-19 TERCERA DOSIS | MINSA PERU";

function generateQR() {
  const canvas = document.getElementById('qrCanvas');
  const ctx = canvas.getContext('2d');
  const size = 200;
  canvas.width = size;
  canvas.height = size;

  // Use Google Charts API to generate QR
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = function() {
    ctx.drawImage(img, 0, 0, size, size);
  };
  img.onerror = function() {
    // Fallback: use QR Server API
    const img2 = new Image();
    img2.crossOrigin = "anonymous";
    img2.onload = function() { ctx.drawImage(img2, 0, 0, size, size); };
    img2.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(QR_DATA);
  };
  img.src = "https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl=" + encodeURIComponent(QR_DATA) + "&choe=UTF-8";
}

window.onload = generateQR;
</script>
